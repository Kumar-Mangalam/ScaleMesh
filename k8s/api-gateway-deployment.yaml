apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: scalemesh
  labels:
    app: api-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: scalemesh-service-account
      containers:
        - name: api-gateway
          image: scalemesh/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SERVICES_TELEMETRY_URL
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: SERVICES_TELEMETRY_URL
            - name: SERVICES_DISPATCH_URL
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: SERVICES_DISPATCH_URL
            - name: SERVICES_ROUTING_URL
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: SERVICES_ROUTING_URL
            - name: SERVICES_DEMAND_URL
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: SERVICES_DEMAND_URL
            - name: SERVICES_INCIDENT_URL
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: SERVICES_INCIDENT_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: scalemesh
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081
