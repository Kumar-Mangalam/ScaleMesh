apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scalemesh-default-deny-ingress
  namespace: scalemesh
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: scalemesh
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  ingress:
    - ports:
        - protocol: TCP
          port: 8081
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services-from-gateway
  namespace: scalemesh
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [fleet-telemetry-service, trip-dispatch-service, route-engine-service, demand-analysis-service, incident-manager-service]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: prometheus
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-from-backends
  namespace: scalemesh
spec:
  podSelector:
    matchLabels:
      app: mysql
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [fleet-telemetry-service, trip-dispatch-service, incident-manager-service]
      ports:
        - protocol: TCP
          port: 3306
  policyTypes:
    - Ingress
