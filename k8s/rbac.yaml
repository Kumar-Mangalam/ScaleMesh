apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalemesh-service-account
  namespace: scalemesh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalemesh-pod-reader
  namespace: scalemesh
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalemesh-pod-reader-binding
  namespace: scalemesh
subjects:
  - kind: ServiceAccount
    name: scalemesh-service-account
    namespace: scalemesh
roleRef:
  kind: Role
  name: scalemesh-pod-reader
  apiGroup: rbac.authorization.k8s.io
