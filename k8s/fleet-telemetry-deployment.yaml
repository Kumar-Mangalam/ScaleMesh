apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-telemetry-service
  namespace: scalemesh
  labels:
    app: fleet-telemetry-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fleet-telemetry-service
  template:
    metadata:
      labels:
        app: fleet-telemetry-service
    spec:
      serviceAccountName: scalemesh-service-account
      containers:
        - name: fleet-telemetry
          image: scalemesh/fleet-telemetry-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: scalemesh-config
                  key: DB_PORT
            - name: DB_NAME
              value: scalemesh_telemetry
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: scalemesh-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scalemesh-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-telemetry-service
  namespace: scalemesh
  labels:
    app: fleet-telemetry-service
spec:
  selector:
    app: fleet-telemetry-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
